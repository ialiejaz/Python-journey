<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Feed Recommendation Calculator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 22px;
            padding: 16px;
            border-radius: 8px;
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            display: none;
        }

        .result-box h3 {
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 4px;
        }

        .result-box p {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3a8a;
        }

        .info-note {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🐾 Pet Feed Guide</h1>
    
    <div class="form-group">
        <label for="animal">Which pet do you have?</label>
        <select id="animal">
            <option value="cat">Cat 🐱</option>
            <option value="dog">Dog 🐶</option>
        </select>
    </div>

    <div class="form-group">
        <label for="age">Tell the age:</label>
        <input type="number" id="age" min="0" step="any" placeholder="e.g. 5">
    </div>

    <div class="form-group">
        <label for="timeFrame">Time frame:</label>
        <select id="timeFrame">
            <option value="1">Weeks</option>
            <option value="2">Months</option>
            <option value="3">Years</option>
        </select>
    </div>

    <button onclick="calculateFeed()">Get Suggested Feed</button>

    <div class="result-box" id="resultBox">
        <h3>Suggested Feed:</h3>
        <p id="feedResult">-</p>
        <div class="info-note" id="conversionInfo"></div>
    </div>
</div>

<script>
function calculateFeed() {
    const animal = document.getElementById("animal").value;
    let age = parseFloat(document.getElementById("age").value);
    let timeFrame = parseInt(document.getElementById("timeFrame").value);
    const resultBox = document.getElementById("resultBox");
    const feedResult = document.getElementById("feedResult");
    const conversionInfo = document.getElementById("conversionInfo");

    if (isNaN(age) || age < 0) {
        alert("Please enter a valid age.");
        return;
    }

    let note = "";

    // Conversion Logic
    if (timeFrame === 1 && age > 8) {
        age = age / 4.33;
        timeFrame = 2;
        note = `(Converted to ~${age.toFixed(1)} months)`;
    }

    if (timeFrame === 2 && age > 12) {
        age = age / 12;
        timeFrame = 3;
        note = `(Converted to ~${age.toFixed(1)} years)`;
    }

    let feed = null;

    // Cat logic
    if (animal === "cat") {
        if (timeFrame === 1) {
            if (age <= 4) feed = "KMR (Kitten Milk Replacer)";
            else if (age <= 8) feed = "KMR with kitten kibble";
        } else if (timeFrame === 2) {
            if (age <= 12) feed = "Canned wet kitten food";
        } else if (timeFrame === 3) {
            if (age >= 1 && age <= 7) feed = "High protein, moderate fat";
            else if (age > 7) feed = "Highly digestible protein, joint supplements";
        }
    } 
    // Dog logic
    else if (animal === "dog") {
        if (timeFrame === 1) {
            if (age <= 4) feed = "Mother's milk or Commercial Puppy Milk Replacer";
            else if (age <= 8) feed = "Weaning slurry of puppy food mixed with milk replacer or warm water";
        } else if (timeFrame === 2) {
            if (age <= 12) feed = "Breed-size specific puppy food";
        } else if (timeFrame === 3) {
            if (age >= 1 && age <= 7) feed = "Sustained energy, muscle maintenance";
            else if (age > 7) feed = "Lower calories to prevent obesity, increased fiber for gut motility";
        }
    }

    // Display output
    resultBox.style.display = "block";
    if (feed) {
        feedResult.textContent = feed;
        conversionInfo.textContent = note;
    } else {
        feedResult.textContent = "Invalid details provided!";
        conversionInfo.textContent = "";
    }
}
</script>

</body>
</html>
